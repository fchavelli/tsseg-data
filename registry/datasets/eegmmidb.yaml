notes: "All 109 subjects and all 14 runs retained. R01/R02 retained with eyes-open/closed protocol context and literal EDF+ codes. S089R01/R02 unexpectedly contain T0 for 0.1 s then T1 for 60.05 s; preserve and flag unresolved baseline T1 semantics, never infer a motor task. Other baselines contain only T0. One default config preserves all 64 native EEG channels in calibrated float32 uV; no duplicate light view, to retain the local 18-GiB disk reserve. Actual native rates: 36 task runs R03-R14 of S088/S092/S100 at 128 Hz, all other 1,490 runs at 160 Hz, correcting the nominal 160-Hz summary; exact elapsed time_ns and per-series frequency preserve timing without resampling. T1/T2 meanings depend on run paradigm, retained in metadata; never pool as universal target identities. EDF+ literal onset/duration is canonical; preserve .event conversions separately and report missing/extra intervals rather than assume source equivalence. Low-level WFDB byte-pair decoding retains real notes at sample zero that rdann filters out. Native EEG/TAL decoding checked against pyedflib on 160-Hz, 128-Hz and long pilot runs. No participant/run rejection or filtering. Group evaluation by participant."
