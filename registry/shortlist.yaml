# task : sd = labels d'états denses (utilisables aussi en CPD) ; cpd = CP annotés seuls.
# license_check : rempli seulement si license_verified était faux/vide (aucun cas)
# ou si une vérification restait ouverte dans le registre.

progress:
  done:
    - "lot 1 (10) : jeux TSB-SEG inclus d'office (tssb … mocap)"
    - "lot 2 (10) : JIGSAWS ×3 + physio (sleep-edfx … helsinki-neonatal-eeg)"
