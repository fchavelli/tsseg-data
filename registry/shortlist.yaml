    - "lot 4 (10) : HAR, éthologie, industrie/énergie"
    - "lot 5 (8) : mocap/chirurgie/assemblage, CPD génériques, synthétique"
    - "vérification de licence : aucun jeu retenu avec license_verified vide ; contrôle ouvert RIPE Atlas tenté (non concluant)"
    - runners_up
    - "2026-10-17, décision utilisateur : JIGSAWS ×3 (D) retirés de la nouvelle collection (rosmag40 suffit pour la chirurgie) ; (correction 2026-10-18 : JIGSAWS ne figure PAS dans TSB-SEG, seulement dans tsseg-exp ; donc simplement exclus). Jeux à contact auteur (tcpd, mocap, bee-dance, utsa, usc-had) gardés."
